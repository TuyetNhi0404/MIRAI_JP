# MIRAI_JP — full stack for VPS deployment
# Usage:
#   cp .env.docker.example .env
#   # fill secrets (MONGO_URI, JWT_*, GEMINI_API_KEY, ...)
#   docker compose up -d --build
#
# App: http://YOUR_VPS_IP  (frontend nginx → API + static)

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  local-llm:
    image: ghcr.io/ggerganov/llama.cpp:server
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/qwen3-1.7b-q4_k_m.gguf
      --host 0.0.0.0
      --port 11434
      -c 2048
      -n 256
      --threads 4
      -ngl 0
    ports:
      - "11434:11434"
    restart: unless-stopped
    mem_limit: 1.5g

  melo-tts:
    build:
      context: ./services/melo-tts
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    restart: unless-stopped
    mem_limit: 512m

  ocr:
    build:
      context: ./services/speaking-practice
      args:
        PREBAKE_MODELS: ${OCR_PREBAKE_MODELS:-1}
    restart: unless-stopped
    depends_on:
      - local-llm
      - melo-tts
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://local-llm:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3-1.7b}
      MELO_TTS_URL: ${MELO_TTS_URL:-http://melo-tts:8001}
      WHISPER_BIN: ${WHISPER_BIN:-/usr/local/bin/whisper-cli}
      WHISPER_MODEL: ${WHISPER_MODEL:-/models/ggml-small.bin}
      # Fallback APIs
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-256}
      SPEAKING_INTERNAL_KEY: ${SPEAKING_INTERNAL_KEY:-mirai-speaking-dev-key}
      SKIP_SPEAKING_AUTH: ${SKIP_SPEAKING_AUTH:-true}
    volumes:
      - ocr_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  backend:
    ports:
      - "5000:5000"
    build:
      context: ./BE
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      REFRESH_SECRET: ${REFRESH_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      GEMINI_API_KEY_AUDIT: ${GEMINI_API_KEY_AUDIT:-}
      GEMINI_API_KEY_CV: ${GEMINI_API_KEY_CV:-}
      ELEVEN_API_KEY: ${ELEVEN_API_KEY:-}
      ELEVEN_VOICE_ID: ${ELEVEN_VOICE_ID:-JBFqnCBsd6RMkjVDRZzb}
      ELEVEN_MODEL: ${ELEVEN_MODEL:-eleven_flash_v2_5}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      REDIS_URL: redis://redis:6379
      ENABLE_GRAMMAR_QUEUE: "true"
      SPEAKING_SERVICE_URL: http://ocr:8000
      ENABLE_SPEAKING_PRACTICE: ${ENABLE_SPEAKING_PRACTICE:-true}
      SPEAKING_INTERNAL_KEY: ${SPEAKING_INTERNAL_KEY:-mirai-speaking-dev-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      USE_ATLAS_VECTOR_SEARCH: ${USE_ATLAS_VECTOR_SEARCH:-false}
      ATLAS_VECTOR_INDEX: ${ATLAS_VECTOR_INDEX:-grammar_chunk_vector}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
    volumes:
      - grammar_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      ocr:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  frontend:
    build:
      context: ./FE
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_CLIENT_SECRET: ${VITE_GOOGLE_CLIENT_SECRET:-}
        VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI:-http://localhost}
        VITE_ENABLE_SPEAKING_PRACTICE: ${VITE_ENABLE_SPEAKING_PRACTICE:-false}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
  grammar_uploads:
  ocr_uploads:

